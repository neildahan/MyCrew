name: Fire due reminders

# Vercel's Hobby plan allows one cron per day, but reminders need checking
# every few minutes to land near their remind_at time. GitHub Actions has a
# 5-minute floor and is free on public repos, so the schedule lives here and
# simply calls the app's own endpoint.
#
# Note: GitHub may delay scheduled runs under load, and disables schedules on
# repos with no activity for 60 days.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # lets you fire it by hand from the Actions tab

concurrency:
  # Never let a slow run overlap the next tick and send a reminder twice.
  group: reminders
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi

          response=$(curl -sS --max-time 60 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://mycrew-app.vercel.app/api/cron/reminders")

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)

          echo "HTTP $code"
          echo "$body"

          # A non-2xx here means reminders are silently not being delivered,
          # which is the one failure mode that must never pass unnoticed.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Reminder run failed with HTTP $code"
            exit 1
          fi
