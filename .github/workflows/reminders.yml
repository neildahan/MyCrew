name: Fire due reminders

# Vercel's Hobby plan allows one cron per day, but reminders need checking
# every few minutes to land near their remind_at time. GitHub Actions has a
# 5-minute floor and is free on public repos.
#
# The job talks to Supabase and WhatsApp directly rather than calling the app's
# cron route: that route is guarded by a shared secret, and keeping that secret
# in sync across two dashboards is exactly what kept reminders from ever firing.
#
# Note: GitHub may delay scheduled runs under load, and disables schedules on
# repos with no activity for 60 days.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Never let a slow run overlap the next tick and send a reminder twice.
  group: reminders
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Send due reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: node scripts/send-reminders.mjs
